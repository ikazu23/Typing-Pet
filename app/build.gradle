apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// GitHub Actions がビルド時だけ Secrets から復元する固定の署名鍵(リポジトリには入れない)
def stableKeystore = file("typingpet.jks")

android {
    namespace 'com.typingpet.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.typingpet.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        stable {
            if (stableKeystore.exists()) {
                storeFile stableKeystore
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (stableKeystore.exists()) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            if (stableKeystore.exists()) signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "androidx.core:core:1.13.1"
}
